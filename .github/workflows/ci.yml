name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  companion:
    needs: firmware
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: download firmware components
        uses: actions/download-artifact@v4
        with:
          name: firmware-managed-components
          path: firmware/managed_components
      # No floating `stable` here: the toolchain comes from
      # companion/rust-toolchain.toml, so this job and a developer machine run
      # the identical compiler and lint set. See that file for why.
      - name: install pinned rust toolchain
        working-directory: companion
        run: |
          rustup show active-toolchain || true
          cargo --version
          cargo clippy --version
          cargo fmt --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: companion
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - name: rust fmt
        working-directory: companion
        run: cargo fmt --all --check
      - name: rust clippy
        working-directory: companion
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: rust tests (all targets)
        working-directory: companion
        run: cargo test --workspace --all-targets --locked
      - name: rust doctests
        working-directory: companion
        run: cargo test --workspace --doc --locked
      - name: frontend install
        working-directory: companion/apps/deskmate
        run: bun install --frozen-lockfile
      - name: frontend format
        working-directory: companion/apps/deskmate
        run: bun run format:check
      - name: frontend lint
        working-directory: companion/apps/deskmate
        run: bun run lint
      - name: frontend tests
        working-directory: companion/apps/deskmate
        run: bun test
      - name: frontend typecheck
        working-directory: companion/apps/deskmate
        run: bun run check
      - name: frontend production build
        working-directory: companion/apps/deskmate
        run: bun run build
      - name: install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit (non-blocking)
        working-directory: companion
        run: cargo audit
        continue-on-error: true
      - name: bun audit (non-blocking)
        working-directory: companion/apps/deskmate
        run: bun audit
        continue-on-error: true
      # The companion is deployed by copying this directory to the server's
      # DESKMATE_WEB_DIR, so the artifact is the built site, not an installer.
      - name: upload companion
        uses: actions/upload-artifact@v4
        with:
          name: deskmate-web
          path: companion/apps/deskmate/dist
          retention-days: 14
          if-no-files-found: error

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Host tests run inside the IDF container AFTER idf.py build because
      # firmware/managed_components/ (tinycbor sources) is gitignored and only
      # exists once the component manager has fetched dependencies.
      #
      # The `sanitize` pass is not a nicety. Two of scene_decode.c's bounds --
      # the node-array cap and the line-point cap -- guard out-of-bounds
      # WRITES whose only symptom is the write itself: with either bound
      # deleted, scene_model_validate() still returns the same error code the
      # test asserts, so the plain suite passes against the broken decoder.
      # ASan is what distinguishes them, and there is no way to rewrite either
      # test so it fails without it.
      - name: idf build + host tests
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.5
          target: esp32s3
          path: firmware
          command: idf.py build && make -C host_tests clean test && make -C host_tests sanitize
      - name: verify firmware lockfile unchanged
        run: git diff --exit-code -- firmware/dependencies.lock
      # lvgl-sim compiles these exact lockfile-resolved sources on macOS. Keep
      # the transfer narrow: the full LVGL component includes 150+ MB of docs,
      # demos, and tests that lvgl-sim does not build.
      - name: upload firmware components
        uses: actions/upload-artifact@v4
        with:
          name: firmware-managed-components
          path: |
            firmware/managed_components/lvgl__lvgl/src
            firmware/managed_components/lvgl__lvgl/lvgl.h
            firmware/managed_components/lvgl__lvgl/lvgl_private.h
            firmware/managed_components/lvgl__lvgl/lv_version.h
            firmware/managed_components/espressif__cbor/tinycbor/src
          retention-days: 1
          if-no-files-found: error
