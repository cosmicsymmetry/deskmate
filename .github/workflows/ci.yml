name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  companion:
    needs: firmware
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: download firmware components
        uses: actions/download-artifact@v4
        with:
          name: firmware-managed-components
          path: firmware/managed_components
      # No floating `stable` here: the toolchain comes from
      # companion/rust-toolchain.toml, so this job and a developer machine run
      # the identical compiler and lint set. See that file for why.
      - name: install pinned rust toolchain
        working-directory: companion
        run: |
          rustup show active-toolchain || true
          cargo --version
          cargo clippy --version
          cargo fmt --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: companion
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - name: rust fmt
        working-directory: companion
        run: cargo fmt --all --check
      - name: rust clippy
        working-directory: companion
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: rust tests (all targets)
        working-directory: companion
        run: cargo test --workspace --all-targets --locked
      - name: rust doctests
        working-directory: companion
        run: cargo test --workspace --doc --locked
      - name: frontend install
        working-directory: companion/apps/deskmate
        run: bun install --frozen-lockfile
      - name: frontend format
        working-directory: companion/apps/deskmate
        run: bun run format:check
      - name: frontend lint
        working-directory: companion/apps/deskmate
        run: bun run lint
      - name: frontend tests
        working-directory: companion/apps/deskmate
        run: bun test
      - name: frontend typecheck
        working-directory: companion/apps/deskmate
        run: bun run check
      - name: frontend production build
        working-directory: companion/apps/deskmate
        run: bun run build
      - name: install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit (non-blocking)
        working-directory: companion
        run: cargo audit
        continue-on-error: true
      - name: bun audit (non-blocking)
        working-directory: companion/apps/deskmate
        run: bun audit
        continue-on-error: true
      # The companion is deployed by copying this directory to the server's
      # DESKMATE_WEB_DIR, so the artifact is the built site, not an installer.
      - name: upload companion
        uses: actions/upload-artifact@v4
        with:
          name: deskmate-web
          path: companion/apps/deskmate/dist
          retention-days: 14
          if-no-files-found: error

  # The build, and ONLY the build. `companion` and `firmware-host-tests` both need
  # this job for one thing: firmware/managed_components/ is gitignored and exists
  # only once the component manager has fetched it, so this job fetches it and
  # hands the two directories anyone compiles on as an artifact.
  #
  # The host tests used to run in this job's one step. When they broke on Linux
  # (2026-08-23, a glibc feature-test macro -- see host_tests/Makefile) the job
  # failed before the upload, `companion` was skipped, and NO Rust or frontend gate
  # ran in CI for four weeks while every local run stayed green. A failing host
  # test must fail loudly in its own job, not switch the rest of CI off.
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: idf build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.5
          target: esp32s3
          path: firmware
          command: idf.py build
      - name: verify firmware lockfile unchanged
        run: git diff --exit-code -- firmware/dependencies.lock
      # lvgl-sim compiles these exact lockfile-resolved sources on macOS. Keep
      # the transfer narrow: the full LVGL component includes 150+ MB of docs,
      # demos, and tests that lvgl-sim does not build.
      - name: upload firmware components
        uses: actions/upload-artifact@v4
        with:
          name: firmware-managed-components
          path: |
            firmware/managed_components/lvgl__lvgl/src
            firmware/managed_components/lvgl__lvgl/lvgl.h
            firmware/managed_components/lvgl__lvgl/lvgl_private.h
            firmware/managed_components/lvgl__lvgl/lv_version.h
            firmware/managed_components/espressif__cbor/tinycbor/src
          retention-days: 1
          if-no-files-found: error

  # The server-rendered faces. Its own job with NO `needs:`, on purpose: from
  # 2026-08-23 to 2026-09-19 a firmware failure skipped everything that needed its
  # artifact and no companion gate ran for four weeks. These gates need nothing from
  # firmware, so nothing in firmware can switch them off. It runs on Linux because
  # that is where the faces actually run: @resvg/resvg-js ships one native binary
  # per platform, and the goldens are only worth having if the deployed platform
  # produces them too.
  faces:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - name: faces install
        working-directory: companion/faces
        run: bun install --frozen-lockfile
      - name: faces format
        working-directory: companion/faces
        run: bun run format:check
      - name: faces lint
        working-directory: companion/faces
        run: bun run lint
      - name: faces typecheck
        working-directory: companion/faces
        run: bun run check
      - name: faces tests
        working-directory: companion/faces
        run: bun test
      - name: plugin directory and isolated deploy preflight
        run: bun test tools/plugins/releases.test.ts
      - name: reviewed release content and pending submissions
        working-directory: companion/faces
        run: bun run src/author/releases.ts check
      # What the server actually runs: the package must describe itself from a cold
      # start, as the subprocess does, not only under the test runner.
      - name: faces describe
        working-directory: companion/faces
        run: bun run src/main.ts describe

  # A small diff job gates rendering, so plugin previews do not wait for firmware.
  plugin-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      ids: ${{ steps.diff.outputs.ids }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: find changed plugin folders
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          IS_PR: ${{ github.event_name == 'pull_request' }}
        run: |
          python3 - <<'PYTHON'
          import json, os, subprocess
          base, head = os.environ["BASE_SHA"], os.environ["HEAD_SHA"]
          if not base or set(base) == {"0"}:
              command = ["git", "diff-tree", "--root", "--no-commit-id", "-r", "--name-only", "-z", head]
          else:
              revision = base + ("..." if os.environ["IS_PR"] == "true" else "..") + head
              command = ["git", "diff", "--no-renames", "--name-only", "-z", revision]
          paths = subprocess.check_output(command).decode().split("\0")
          prefix = "companion/faces/plugins/"
          changed = [path for path in paths if path.startswith(prefix)]
          ids = sorted({path[len(prefix):].split("/")[0] for path in changed if "/" in path[len(prefix):]})
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("changed=" + str(bool(changed)).lower() + "\n")
              output.write("ids=" + json.dumps(ids, ensure_ascii=True) + "\n")
          PYTHON

  plugin-release-policy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: release approval policy tests
        run: python3 -m unittest discover -s tools/plugins -p 'test_*.py'
      # Also exercise the policy in its initial owner PR. After merge, the
      # independent pull_request_target workflow enforces trusted base code even
      # when an outside author edits or removes this ordinary PR workflow.
      - name: check index approval
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: python3 tools/plugins/check_release_approval.py

  plugin-previews:
    needs: plugin-changes
    if: needs.plugin-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - name: install faces dependencies
        working-directory: companion/faces
        run: bun install --frozen-lockfile --ignore-scripts
      - name: check every changed plugin without network or secrets
        working-directory: companion/faces
        env:
          CHANGED_PLUGIN_IDS: ${{ needs.plugin-changes.outputs.ids }}
        run: |
          python3 - <<'PYTHON'
          import json, os, pathlib, re, subprocess
          failed = False
          output = pathlib.Path("out/plugins")
          output.mkdir(parents=True, exist_ok=True)
          removed = []
          for plugin in json.loads(os.environ["CHANGED_PLUGIN_IDS"]):
              if not re.fullmatch(r"[a-z0-9]+(?:-[a-z0-9]+)*", plugin):
                  print("Invalid plugin folder id: " + repr(plugin))
                  failed = True
                  continue
              if not pathlib.Path("plugins", plugin).exists():
                  removed.append(plugin)
                  continue
              result = subprocess.run(["bun", "run", "plugin:check", plugin])
              failed = result.returncode != 0 or failed
          (output / "removed.json").write_text(json.dumps(removed) + "\n")
          raise SystemExit(1 if failed else 0)
          PYTHON
      - name: upload plugin previews and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-previews-${{ github.event.pull_request.head.sha || github.sha }}
          path: companion/faces/out/plugins/
          retention-days: 14
          if-no-files-found: warn

  firmware-host-tests:
    needs: firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The host tests are plain C and need one fetched directory: tinycbor's
      # sources, which the artifact carries. No IDF container required.
      - name: download firmware components
        uses: actions/download-artifact@v4
        with:
          name: firmware-managed-components
          path: firmware/managed_components
      - name: host tests
        run: make -C firmware/host_tests clean test
      # The `sanitize` pass is not a nicety. Two of scene_decode.c's bounds --
      # the node-array cap and the line-point cap -- guard out-of-bounds
      # WRITES whose only symptom is the write itself: with either bound
      # deleted, scene_model_validate() still returns the same error code the
      # test asserts, so the plain suite passes against the broken decoder.
      # ASan is what distinguishes them, and there is no way to rewrite either
      # test so it fails without it.
      - name: host tests under ASan + UBSan
        run: make -C firmware/host_tests sanitize
