[workspace]
resolver = "2"
members = [
    "apps/deskmate/src-tauri",
    "crates/app-core",
    "crates/deskmate-cli",
    "crates/device",
    "crates/engine",
    "crates/lvgl-sim",
    "crates/protocol",
    "crates/providers",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.97"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
