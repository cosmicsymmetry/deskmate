[package]
name = "app-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
atomic-write-file = "0.3.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
device = { path = "../device" }
protocol = { path = "../protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"

[dev-dependencies]
protocol = { path = "../protocol", features = ["test-support"] }
# `examples/scene_panel_check.rs` consumes lvgl-sim's cases to compare simulator
# frames against a real board. This edge is dev-only; lvgl-sim normally depends
# on app-core for the host scene builders those cases exercise.
lvgl-sim = { path = "../lvgl-sim" }
tempfile = "3"

[lints]
workspace = true
