[package]
name = "app-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
atomic-write-file = "0.3.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
device = { path = "../device" }
protocol = { path = "../protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"

[dev-dependencies]
protocol = { path = "../protocol", features = ["test-support"] }
# `examples/scene_panel_check.rs` drives the simulator's case tables against a
# real board. A dev-dependency rather than the reverse direction because
# `lvgl-sim` cannot depend on this crate: `app-core -> device -> lvgl-sim`
# already, so anything needing both has to live on this side of that edge.
lvgl-sim = { path = "../lvgl-sim" }
tempfile = "3"

[lints]
workspace = true
