[package]
name = "app-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
atomic-write-file = "0.3.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
device = { path = "../device" }
engine = { path = "../engine" }
protocol = { path = "../protocol" }
providers = { path = "../providers" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# Task 9 (stage 2a): the parity gate in `tests/scene_parity.rs` renders the
# shipped `DigitalClock` C template and `scene_build`'s scene through the same
# LVGL simulator and compares the framebuffers byte for byte. A dev-dependency
# rather than the reverse direction because `lvgl-sim` cannot depend on this
# crate: `app-core -> device -> lvgl-sim` already, so the gate has to live on
# this side of that edge.
lvgl-sim = { path = "../lvgl-sim" }
# Only so a failing parity gate can dump both frames as PNGs to look at; a
# differing-pixel count localises nothing on its own.
png = "0.17"

[lints]
workspace = true
