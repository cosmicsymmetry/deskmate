[package]
name = "deskmate-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
app-core = { path = "../app-core" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
