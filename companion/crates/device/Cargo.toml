[package]
name = "device"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
protocol = { path = "../protocol" }
serialport = { version = "4.9.0", default-features = false }

# framebuffer_diff.rs (Task 10) renders the shared golden case table on the
# host to compare against a physical device's dev-only framebuffer capture.
[dev-dependencies]
lvgl-sim = { path = "../lvgl-sim" }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }

[lints]
workspace = true
