[package]
name = "lvgl-sim"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
png = "0.17"
# Task 8: the scene model and its CBOR encoder. `render_scene` hands the
# firmware's own scene_decode() the bytes protocol::encode_scene_payload
# writes, so the simulator and the device build their scene_t from the same
# payload with the same decoder.
protocol = { path = "../protocol" }

[dev-dependencies]
# Task 12: verifies assets::INTER_SUBSET_SHA256 still matches the committed
# assets/Inter-subset.ttf. Not used by the non-test render path itself,
# which registers assets under the written-down digest constant, never a
# hash computed at render time.
sha2 = "0.10"

[build-dependencies]
cc = "1"
glob = "0.3"

# This crate wraps the firmware's LVGL templates over an FFI boundary, which
# is unavoidably `unsafe`. The workspace forbids `unsafe_code` by default, so
# `[lints] workspace = true` cannot be used here (it would inherit the
# forbid and make the crate uncompilable). Instead the clippy groups are
# copied verbatim from `[workspace.lints.clippy]` and `unsafe_code` is
# explicitly allowed, contained to `src/lib.rs`'s `extern "C"` block and the
# `unsafe` calls into it.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
