# Task 6's producer-to-pixel fixture. This is a real manifest-v2 scene, parsed
# and compiled by the production plugin crate before lvgl-sim renders it.
manifest_version = 2
name = "timer-evidence"
version = "1.0.0"

[source]
kind = "json"
url = "https://example.invalid/timer.json"
refresh_minutes = 15

[template]
kind = "scene"

[[nodes]]
kind = "arc"
cx = 224
cy = 184
r = 160
start_deg = 270
end_deg = 630
width = 16
color = 0x25252B

[[nodes]]
kind = "arc"
cx = 224
cy = 184
r = 160
start_deg = 270
end_deg = 630
end_binding = "{{ timer.permille }}"
width = 16
color = 0xFF8F2E
caps = true

[[nodes]]
kind = "text"
x = 96
baseline_y = 205
w = 256
align = "center"
font = { tier = "display" }
color = 0xF5F5F7
value = "{{ timer.remaining:mm:ss }}"
