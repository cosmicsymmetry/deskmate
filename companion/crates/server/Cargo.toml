[package]
name = "server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
app-core = { path = "../app-core" }
device = { path = "../device" }
plugin = { path = "../plugin" }
protocol = { path = "../protocol" }
providers = { path = "../providers" }
atomic-write-file = "0.3.0"
axum = { version = "0.8", features = ["ws"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "fs", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "0.5", features = ["limit", "load-shed", "timeout", "util"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
rand = "0.9"
sha2 = "0.10"
# The homelab render host permits exactly one in-process SVG engine: `resvg`.
# Defaults stay off so raster-image loading, system-font discovery, and mmap font
# access cannot grow ambient filesystem/network authority; only SVG text shaping is on.
resvg = { version = "=0.45.1", default-features = false, features = ["text"] }
# A separate, bounded XML policy pass rejects hostile structure before `usvg`
# allocates its normalized render tree.
roxmltree = "=0.20.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Egress guard (companion/crates/server/src/egress.rs): outbound plugin data
# fetches need TLS, hence "rustls" here even though the dev-dependency below
# (used by loopback-only integration tests) stays TLS-less.
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
url = "2"
# Backs `FirmwareCatalog::in_memory()`, which is normal library API (used by
# every integration test binary, not just this crate's own #[cfg(test)]
# code) -- it must be a real dependency, not a dev-dependency.
tempfile = "3"

[dev-dependencies]
protocol = { path = "../protocol", features = ["test-support"] }
tokio-tungstenite = "0.24"
reqwest = { version = "0.13", default-features = false }
http = "1"
# egress.rs's timeout-budget tests use tokio's virtual clock
# (`#[tokio::test(start_paused = true)]`) to prove the cap deterministically
# without a real 20-second sleep.
tokio = { version = "1", features = ["test-util"] }

[lints]
workspace = true
