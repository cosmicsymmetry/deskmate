[package]
name = "server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
app-core = { path = "../app-core" }
device = { path = "../device" }
# The card preview the browser companion renders. app-core builds the same scene
# sent to the panel, then lvgl-sim executes the firmware's scene decoder and
# interpreter over FFI. `crates/lvgl-sim/tests/preview_path.rs` checks the complete
# preview path.
lvgl-sim = { path = "../lvgl-sim" }
protocol = { path = "../protocol" }
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "fs", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "0.5", features = ["limit", "load-shed", "timeout", "util"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
rand = "0.9"
rusqlite = { version = "0.39", features = ["bundled"] }
sha2 = "0.10"
# Header-first PNG decoding for the image-ingest route. `Pixmap::decode_png` would
# need no new line here but decodes in one shot; `png::Decoder::read_header_info`
# reads the IHDR alone, which is what lets a decompression bomb be rejected before
# anything is allocated.
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Shared by production egress and the HTTP-facing tests. `rustls` covers the
# OAuth token call; `form` is that token POST, whose one-host allowlist lives in
# `egress::fetch_post_form`. The server-rendered faces fetch from their own
# subprocess (`companion/faces`), not through this.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "form"] }
url = "2"
# Backs `FirmwareCatalog::in_memory()`, which is normal library API (used by
# every integration test binary, not just this crate's own #[cfg(test)]
# code) -- it must be a real dependency, not a dev-dependency.
tempfile = "3"
chacha20poly1305 = "=0.10.1"
zeroize = { version = "=1.9.0", features = ["derive"] }
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "ring", "webpki-roots"] }

[dev-dependencies]
protocol = { path = "../protocol", features = ["test-support"] }
tokio-tungstenite = "0.29"
http = "1"

[lints]
workspace = true
