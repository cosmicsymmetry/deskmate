[package]
name = "server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
app-core = { path = "../app-core" }
device = { path = "../device" }
protocol = { path = "../protocol" }
atomic-write-file = "0.3.0"
axum = { version = "0.8", features = ["ws"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "fs", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "0.5", features = ["limit", "load-shed", "timeout", "util"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
rand = "0.9"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Backs `FirmwareCatalog::in_memory()`, which is normal library API (used by
# every integration test binary, not just this crate's own #[cfg(test)]
# code) -- it must be a real dependency, not a dev-dependency.
tempfile = "3"

[dev-dependencies]
protocol = { path = "../protocol", features = ["test-support"] }
tokio-tungstenite = "0.24"
reqwest = { version = "0.13", default-features = false }
http = "1"

[lints]
workspace = true
