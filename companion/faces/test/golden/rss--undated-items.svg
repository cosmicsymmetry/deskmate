<svg xmlns="http://www.w3.org/2000/svg" width="448" height="368" viewBox="0 0 448 368"><rect x="0.00" y="0.00" width="448.00" height="368.00" fill="#000000"/><text x="24.00" y="34.91" font-family="Inter" font-size="15.00" font-weight="600" fill="#84848d" text-anchor="start" letter-spacing="1.40">NO DATES</text><rect x="24.00" y="52.00" width="400.00" height="1.00" fill="#2a2a2f"/><rect x="24.00" y="72.00" width="4.00" height="58.50" rx="2.00" fill="#30d158"/><text x="44.00" y="94.54" font-family="Inter" font-size="31.00" font-weight="600" fill="#f5f5f7" text-anchor="start">A feed whose items</text><text x="44.00" y="130.50" font-family="Inter" font-size="31.00" font-weight="600" fill="#f5f5f7" text-anchor="start">carry no pubDate at all</text><rect x="24.00" y="146.50" width="400.00" height="1.00" fill="#2a2a2f"/><text x="24.00" y="203.51" font-family="Inter" font-size="21.00" font-weight="400" fill="#a0a0a8" text-anchor="start">So none of these rows print an age</text><rect x="24.00" y="245.25" width="400.00" height="1.00" fill="#2a2a2f"/><text x="24.00" y="302.26" font-family="Inter" font-size="21.00" font-weight="400" fill="#a0a0a8" text-anchor="start">And the lead prints none either</text></svg>