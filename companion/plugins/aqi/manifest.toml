# aqi -- one of Deskmate's two curated plugins (Task 8 of the plugin-manifest
# stage). A JSON source with a numeric hero and an icon glyph: it exercises
# the icon-font path (a `glyph` node drawing from an uploaded icon-font
# asset) and `field.*` (a device-side binding to a value PushData carries,
# independent of this scene's own compile-time data).
#
# The `[[assets]] kind = "icon-font"` file, `assets/icons.ttf`, is the same
# committed test font `lvgl-sim` already ships as `Inter-subset.ttf`
# (byte-identical, same SHA-256 digest) -- its subset is digits, colon,
# space and A-Z, with no real icon artwork. There is no icon library or font
# tooling available to author real glyph shapes for this stage, so the six
# EPA AQI categories below are mapped to a single capital letter each. This
# is a deliberate stand-in: it exercises the real wire path end to end (an
# uploaded font asset, a `glyph` node resolving a name to a codepoint through
# it, the device drawing that glyph) with a real, already-committed font,
# rather than inventing new binary content or leaving the icon-font path
# untested for want of artwork. Swapping in a real icon font later is a
# content change, not a shape change.
name = "aqi"
version = "1.0.0"

[source]
kind = "json"
url = "https://example.invalid/aqi.json"
refresh_minutes = 15

[[assets]]
kind = "icon-font"
file = "assets/icons.ttf"
glyphs = [
  { name = "good", codepoint = 0x47 },                        # 'G'
  { name = "moderate", codepoint = 0x4D },                    # 'M'
  { name = "unhealthy-for-sensitive-groups", codepoint = 0x53 }, # 'S'
  { name = "unhealthy", codepoint = 0x55 },                   # 'U'
  { name = "very-unhealthy", codepoint = 0x56 },               # 'V'
  { name = "hazardous", codepoint = 0x48 },                   # 'H'
]

# Category label, upper-cased for emphasis.
[[nodes]]
kind = "text"
x = 24
baseline_y = 56
w = 300
align = "left"
font = { tier = "caption" }
color = 0x5C5C66
value = "{{ upper(data.current.category) }}"

# The icon-font path: draws the category's glyph from the uploaded
# `icons.ttf` asset at the codepoint `icon()` resolves it to.
[[nodes]]
kind = "glyph"
x = 24
y = 168
font = { asset = "assets/icons.ttf", pixel_size = 72 }
color = 0xFF8F2E
glyph = "{{ icon(data.current.category) }}"

# Numeric hero: the AQI reading itself.
[[nodes]]
kind = "text"
x = 128
baseline_y = 220
w = 220
align = "left"
font = { tier = "hero" }
color = 0xF5F5F7
value = "{{ data.current.aqi }}"

[[nodes]]
kind = "text"
x = 128
baseline_y = 248
w = 120
align = "left"
font = { tier = "caption" }
color = 0x5C5C66
value = "AQI"

# A secondary reading: PM2.5, rounded to a whole number, and its unit label
# as a separate node -- one `{{ ... }}` field can only ever be the whole
# expression or the whole literal, never a mix of the two, so "42 PM2.5"
# is two nodes, not one interpolated string. `default()` covers the real
# fixture's `pollutants.o3.value` shape (a JSON `null` reading) even though
# PM2.5 itself is never null in the captured payload -- authored
# defensively, the way a real API's next response might differ from today's.
[[nodes]]
kind = "text"
x = 24
baseline_y = 296
w = 80
align = "left"
font = { tier = "body" }
color = 0xF5F5F7
value = "{{ default(round(data.current.pollutants.pm25.value, 0), \"--\") }}"

[[nodes]]
kind = "text"
x = 104
baseline_y = 296
w = 120
align = "left"
font = { tier = "body" }
color = 0x5C5C66
value = "PM2.5"

# `field.*`: a device-side binding to whatever `PushData` carries for this
# card's `title` field, independent of this compiled scene -- unlike every
# other node above, this text can change without a scene recompile. No
# production path pushes it yet (Task 8's own report says so), so on a real
# device this renders the "--" placeholder until something does; this
# manifest exists to give the binding a real author and real pixel coverage,
# not to claim it is live end to end today.
[[nodes]]
kind = "text"
x = 24
baseline_y = 336
w = 400
align = "left"
font = { tier = "caption" }
color = 0x5C5C66
value = "{{ field.title }}"
