# Hardware-session fixture for stage 4 Task 7 Step 8: the refuse rule, observed.
# It exists only to be refused -- its face carries a live {{ time:HH:mm }} binding,
# which render negotiation must turn into a typed SceneRefused rather than a frozen
# raster frame. Deliberately NOT under companion/plugins/: the curated registry is
# pinned to four ids and this plugin is not curated content. Stage it into the
# server's DESKMATE_PLUGINS_DIR only for the session (see the Task 7 runbook).
manifest_version = 2
name = "svg-live-clock"
version = "1.0.0"

[source]
kind = "json"
url = "https://example.invalid/clock.json"
refresh_minutes = 15

[template]
kind = "svg"
file = "face.svg"
